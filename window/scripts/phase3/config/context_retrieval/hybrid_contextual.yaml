experiment_name: "hybrid_rrf_rerank_contextual"
description: "Hybrid RRF + reranker, with contextual retrieval (LLM context per chunk)"

embedding_model: "BAAI/bge-base-en-v1.5"
normalize_embeddings: true

index_type: "flat"
faiss_index_path: "data/indexes/faiss_contextual.index"
metadata_path: "data/indexes/metadata_contextual.json"   # <-- new

retrieval_type: "hybrid"
hybrid_fusion: "rrf"
rrf_k: 60
sparse_index_path: "data/indexes/bm25_contextual"
retrieve_k: 50

reranker: "bge-reranker-base"
rerank_top_n: 8

query_transform: null
diversity_filter: null

k_values: [1, 5, 10]