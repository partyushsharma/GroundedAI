[project]
name = "hybrid-rag"
version = "0.1.0"
description = "GroundedAI: hybrid retrieval RAG over Indian financial regulation, built to be measured"
readme = "README.md"
authors = [
    { name = "Partyush Sharma", email = "isingh@scudio.ai" }
]
requires-python = ">=3.12,<3.13"

# Direct dependencies only -- the tools named in the project's Tech Stack.
# Everything else in .venv is a transitive dependency and is pinned by uv.lock.
# Lower bounds are the versions this project was developed and verified against.
dependencies = [
    # --- Parse ladder (layers 2) --------------------------------------------
    "pymupdf>=1.28.2",              # tier 1: fast text extraction
    "docling>=2.121.0",             # tier 2: layout-aware, handles tables
    "pytesseract>=0.3.13",          # tier 3: binding to the Tesseract binary
    "pillow>=11.0.0",               # page rasterisation before OCR
    # --- Chunking, metadata, dedup (layers 3-5) -----------------------------
    "langchain-text-splitters>=1.1.2",
    "datasketch>=2.0.0",            # MinHash near-duplicate detection
    "pydantic>=2.13.4",             # ChunkMeta and the answer schema
    "pydantic-settings>=2.15.0",
    # --- Embeddings (layer 6) -----------------------------------------------
    "sentence-transformers>=6.0.0",
    "flagembedding>=1.4.0",         # BGE-family helpers
    "torch>=2.13.0",
    "accelerate>=1.14.0",
    "einops>=0.8.2",                # imported by nomic-embed's remote code
    "huggingface-hub>=1.16.1",
    # --- Indexes (layers 7-9) -----------------------------------------------
    "faiss-cpu>=1.15.0",            # Flat / HNSW / IVF, the tuning target
    "chromadb>=1.5.9",              # second store, for metadata filtering
    "bm25s>=0.3.10",                # sparse half of hybrid retrieval
    # --- Generation (layers 15-18) ------------------------------------------
    "litellm>=1.97.0",              # Groq -> Gemini -> OpenRouter fallback
    # --- Guardrails (layers 19-20) ------------------------------------------
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "spacy>=3.8.15",                # Presidio's NER backend
    # --- Evaluation and observability (layers 21-27) ------------------------
    "ragas>=0.4.3",
    "deepeval>=4.1.9",
    "langfuse>=4.14.4",
    # --- Serving (layer 29) -------------------------------------------------
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    # --- Shared utilities ---------------------------------------------------
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "requests>=2.34.2",             # corpus download, task 1.1
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",                # ablation configs
    "jsonlines>=4.0.0",             # manifest and golden set
    "tqdm>=4.70.0",
    "typer>=0.26.8",
    # --- spaCy model, resolved via [tool.uv.sources] below ------------------
    "en-core-web-sm",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "openpyxl>=3.1.5",              # reads the project workbook
]

[project.scripts]
hybrid-rag = "hybrid_rag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# ragas 0.4.3 imports langchain_community.chat_models.vertexai, which was
# removed in langchain-community 0.4. Left unpinned, `uv sync` upgrades the
# transitive dependency and ragas stops importing -- caught by doctor.py.
# Constraint rather than a direct dependency: we never import it ourselves.
constraint-dependencies = ["langchain-community<0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# spaCy models are not on PyPI under a resolvable version range, so they are
# declared as explicit sources. Presidio needs en_core_web_sm at minimum.
[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
